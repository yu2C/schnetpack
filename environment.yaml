name: schnet_fhe
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - numpy=1.26.4
  - sympy
  - ase>=3.21
  - h5py
  - pyyaml
  - hydra-core>=1.1.0
  - pytorch>=2.0.0
  - pytorch-lightning>=2.0.0
  - torchmetrics
  - hydra-colorlog>=1.1.0
  - rich
  - fasteners
  - dirsync
  - torch-ema
  - matscipy
  - tensorboard
  - tensorboardX
  - tqdm
  - pre-commit
  - black
  - protobuf
  - pillow=9.4.0
  - pip>=23
  - pip:
      - concrete-ml
      - pytest
      - pytest-datadir
      - pytest-benchmark
      - setuptools
      - wheel
      - "git+https://github.com/atomistic-machine-learning/schnetpack.git@cc018fd#egg=schnetpack"  # 直接從 GitHub 安裝 schnetpack
